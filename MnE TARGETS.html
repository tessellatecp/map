<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,0.95); border-radius: 8px; padding: 12px 12px 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18); width: 320px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #panel h2 { font-size: 16px; margin: 0 0 8px; }
  #panel label { font-size: 12px; color: #374151; display: block; margin: 10px 0 4px; }
  .search-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #searchInput {
    flex: 1; padding: 6px 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; width: 100%;
  }
  .toggle-row { display: grid; grid-template-columns: auto auto; gap: 8px; margin-top: 6px; font-size: 12px; color: #374151; }
  .legend {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #374151;
  }
  .legend-title { font-weight: 600; margin-bottom: 6px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #11111122; }
  .sw-50p { background: #1E40AF; }
  .sw-10p { background: #0284C7; }
  .sw-2p  { background: #F59E0B; }
  .sw-sm  { background: #EA580C; }
  .sw-unk { background: #9CA3AF; }

  /* MarkerCluster custom colors (purple theme) */
  .marker-cluster-small {
    background: #6D28D9; color: white; border: 3px solid #EDE9FE;
  }
  .marker-cluster-small div { background: #7C3AED; color: #fff; }
  .marker-cluster-medium {
    background: #4C1D95; color: white; border: 3px solid #DDD6FE;
  }
  .marker-cluster-medium div { background: #5B21B6; color: #fff; }
  .marker-cluster-large {
    background: #3730A3; color: white; border: 3px solid #C7D2FE;
  }
  .marker-cluster-large div { background: #4338CA; color: #fff; }

  .popup h3 { margin: 0 0 6px 0; font-size: 16px; }
  .popup .meta { font-size: 13px; line-height: 1.25; }
  .popup .meta div { margin: 2px 0; }
  .popup a { color: #0366d6; text-decoration: none; }
  .popup a:hover { text-decoration: underline; }

  /* Dark toggle pill */
  .dark-toggle {
    display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#374151; user-select:none;
    border:1px solid #d1d5db; border-radius:999px; padding:4px 8px; background:#fff; cursor:pointer;
  }
  .dark-toggle input { margin:0; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h2>Filters</h2>

  <div class="search-row">
    <input id="searchInput" type="text" placeholder="Search company name…" />
  </div>

  <label>Revenue range (£)</label>
  <div id="revSlider"></div>
  <div class="toggle-row">
    <label><input type="checkbox" id="chkRevUnknown" checked /> Include unknown revenue</label>
    <div id="revRangeLabel" style="text-align:right;">10,036,000 – 48,834,000</div>
  </div>

  <label>FTE range</label>
  <div id="fteSlider"></div>
  <div class="toggle-row">
    <label><input type="checkbox" id="chkFteUnknown" checked /> Include unknown FTE</label>
    <div id="fteRangeLabel" style="text-align:right;">22 – 678</div>
  </div>

  <div class="legend">
    <div class="legend-title">Legend (Based on Revenue)</div>
    <div class="legend-item"><span class="swatch sw-50p"></span> £40m+</div>
    <div class="legend-item"><span class="swatch sw-10p"></span> £30–40m</div>
    <div class="legend-item"><span class="swatch sw-2p"></span> £20–30m</div>
    <div class="legend-item"><span class="swatch sw-sm"></span> &lt; £20m</div>
    <div class="legend-item"><span class="swatch sw-unk"></span> Unknown</div>
  </div>

  <!-- Dark toggle at bottom -->
  <div style="margin-top:10px; display:flex; justify-content:flex-end;">
    <label class="dark-toggle" title="Toggle dark map">
      <input type="checkbox" id="darkToggle" /> Dark
    </label>
  </div>
</div>

  const cm = L.circleMarker([m.lat, m.lon], baseStyle);

  const web = m.website ? `<a href="${safe(m.website)}" target="_blank" rel="noopener">${safe(m.website)}</a>` : '';
  const desc = m.description ? `<div><strong>Description:</strong> ${safe(m.description)}</div>` : '';

  cm.bindPopup(`
    <div class="popup">
      <h3 class="title">${safe(m.name)}</h3>
      <div class="meta">
        ${web ? `<div><strong>Website:</strong> ${web}</div>` : ``}
        ${desc}
        <div><strong>FTEs:</strong> ${safe(m.employees)}</div>
        <div><strong>Turnover:</strong> ${safe(m.turnover)}</div>
        <div><strong>EBITDA:</strong> ${safe(m.ebitda)}</div>
        <div><strong>Location:</strong> ${safe(m.location)}</div>
      </div>
    </div>`);

  cm.__data = m;
  cm.__baseStyle = baseStyle;
  clusterGroup.addLayer(cm);
  allMarkers.push(cm);
});

if (allMarkers.length) {
  map.fitBounds(clusterGroup.getBounds().pad(0.1));
}

// --- Sliders (noUiSlider) ---
const revSlider = document.getElementById('revSlider');
const fteSlider = document.getElementById('fteSlider');

noUiSlider.create(revSlider, {
  start: [REV_MIN, REV_MAX],
  connect: true,
  range: { min: REV_MIN, max: REV_MAX },
  step: 100000,
  tooltips: false
});

noUiSlider.create(fteSlider, {
  start: [FTE_MIN, FTE_MAX],
  connect: true,
  range: { min: FTE_MIN, max: FTE_MAX },
  step: 1,
  tooltips: false
});

const revRangeLabel = document.getElementById('revRangeLabel');
const fteRangeLabel = document.getElementById('fteRangeLabel');

function setHighlighted(marker, on) {
  marker.setStyle(on ? { weight: 3, color: '#000', fillOpacity: 1 } : marker.__baseStyle);
}

const searchInput   = document.getElementById('searchInput');
const chkRevUnknown = document.getElementById('chkRevUnknown');
const chkFteUnknown = document.getElementById('chkFteUnknown');

function withinRange(value, min, max, includeUnknown) {
  if (value == null || isNaN(value)) return !!includeUnknown;
  return value >= min && value <= max;
}

function applyFilters() {
  const [revMin, revMax] = revSlider.noUiSlider.get(true);
  const [fteMin, fteMax] = fteSlider.noUiSlider.get(true);
  const q = (searchInput.value || '').trim().toLowerCase();
  const allowRevUnknown = chkRevUnknown.checked;
  const allowFteUnknown = chkFteUnknown.checked;

  // update labels
  const fmt = v => typeof v === 'number' ? v.toLocaleString() : v;
  revRangeLabel.textContent = '£' + fmt(Math.round(revMin)) + ' – £' + fmt(Math.round(revMax));
  fteRangeLabel.textContent = fmt(Math.round(fteMin)) + ' – ' + fmt(Math.round(fteMax));

  clusterGroup.clearLayers();

  for (const m of allMarkers) {
    const d = m.__data;
    const revOK  = withinRange(d.turn_num, revMin, revMax, allowRevUnknown);
    const fteOK  = withinRange(d.fte_num,  fteMin,  fteMax,  allowFteUnknown);
    const nameOK = !q || (d.name || '').toLowerCase().includes(q);

    setHighlighted(m, !!q && nameOK);

    if (revOK && fteOK && nameOK) {
      clusterGroup.addLayer(m);
    }
  }
}

// live search (debounced)
let t = null;
searchInput.addEventListener('input', () => { clearTimeout(t); t = setTimeout(applyFilters, 60); });

// Re-filter on slider **update** for immediate response
revSlider.noUiSlider.on('update', applyFilters);
fteSlider.noUiSlider.on('update', applyFilters);

chkRevUnknown.addEventListener('change', applyFilters);
chkFteUnknown.addEventListener('change', applyFilters);

// --- Dark toggle at bottom ---
const darkToggle = document.getElementById('darkToggle');
darkToggle.addEventListener('change', () => {
  if (darkToggle.checked) { map.removeLayer(light); map.addLayer(dark); }
  else { map.removeLayer(dark); map.addLayer(light); }
});

// initial run
applyFilters();
</script>
</body>
</html>
